{
  "name": "Fehler melden — Deutsch",
  "description": "Unerwartetes Verhalten von GitHubSync melden.",
  "title": "[Bug] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Keine Tokens, privaten Dateien, persönlichen Einstellungen oder unbearbeiteten Logs anhängen. Screenshots und Fehlermeldungen anonymisieren."
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "App- und Windows-Version",
        "placeholder": "GitHubSync 1.5.3; Windows 11; x64"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "mode",
      "attributes": {
        "label": "Richtung und Ziel",
        "options": [
          "Upload: Code",
          "Upload: Release-Dateien",
          "Download: Code",
          "Download: Release-Dateien",
          "Anmeldung oder Oberfläche"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "steps",
      "attributes": {
        "label": "Schritte zur Reproduktion"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "result",
      "attributes": {
        "label": "Erwartetes und tatsächliches Ergebnis"
      },
      "validations": {
        "required": true
      }
    }
  ]
}
