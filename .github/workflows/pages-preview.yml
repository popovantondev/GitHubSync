name: Prepare documentation site
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare local site only
        shell: powershell
        run: ./tools/Build-DocumentationSite.ps1
# Preparation only. No Pages deployment or upload permission is enabled.
